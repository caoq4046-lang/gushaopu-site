<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Agent Chat</title>
<style>
:root{
  --bg:#0e1116; --bg2:#141922; --panel:#1a2029; --panel2:#212836; --line:rgba(255,255,255,.07);
  --txt:#eef2f7; --mut:#93a0b3; --dim:#5d6b7d;
  --ac:#6ea8fe; --ac-2:#8b7cf6; --ac-grad:linear-gradient(135deg,#6ea8fe,#8b7cf6);
  --ok:#4ade80; --warn:#fbbf24; --err:#f87171;
  --rad:13px; --shadow:0 16px 44px rgba(0,0,0,.42);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--txt);overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1200px 600px at -10% 0%,#1b3a5e33,transparent 60%),
    radial-gradient(900px 500px at 110% 110%,#3b2b5e3333,transparent 60%),
    var(--bg);
}
#app{position:relative;z-index:1;display:flex;height:100vh}
button{cursor:pointer;font-family:inherit}

/* ---------- Sidebar ---------- */
#sidebar{width:252px;flex-shrink:0;display:flex;flex-direction:column;background:rgba(18,22,30,.82);
  border-right:1px solid var(--line);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:12px;padding:20px 18px 16px}
.brand .logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;flex-shrink:0;background:var(--ac-grad);box-shadow:0 6px 18px rgba(110,168,255,.32)}
.brand .bt{line-height:1.25}
.brand h1{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.brand small{display:block;color:var(--mut);font-size:11px;color:var(--dim);font-weight:400}
.mode{background:var(--dim+.0);background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--mut);
  border-radius:999px;padding:1px 8px;font-size:9px;font-weight:600;letter-spacing:.06em}

.ws-top{display:flex;align-items:center;justify-content:space-between;padding:4px 18px 8px}
.ws-top span{font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.12em}
.iconbtn{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--dim);
  display:grid;place-items:center;font-size:16px;line-height:1;transition:.18s}
.iconbtn:hover{color:var(--txt);border-color:var(--ac)}

#wsList{flex:1;overflow-y:auto;padding:2px 10px 12px}
.wsitem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;cursor:pointer;margin-bottom:2px;transition:.15s;color:var(--mut);position:relative}
.wsitem:hover{background:rgba(255,255,255,.04);color:var(--txt)}
.wsitem.active{background:linear-gradient(100deg,rgba(110,168,223,.16),rgba(139,124,246,.1));color:var(--txt)}
.wsitem.active::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--ac-grad)}
.wsitem .ava{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex-shrink:0;color:#fff}
.wsitem .info{flex:1;min-width:0}
.wsitem .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsitem .pm{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsitem .del{display:none;background:transparent;border:0;color:var(--dim);font-size:13px;cursor:pointer;padding:3px}
.wsitem:hover .del{display:block}
.wsitem .del:hover{color:var(--err)}

.side-foot{padding:12px;border-top:1px solid var(--line)}
.side-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:10px;
  border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--mut);font-size:12.5px;font-weight:600;transition:.15s}
.side-btn:hover{color:#fff;border-color:var(--ac);background:rgba(110,168,223,.1)}

/* ---------- Main ---------- */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{height:58px;flex-shrink:0;display:flex;align-items:center;padding:0 22px;gap:12px;border-bottom:1px solid var(--line)}
.tt{font-size:15px;font-weight:700}
.sub{font-size:12px;color:var(--dim)}
.spacer{flex:1}
.model-chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);padding:6px 13px;border-radius:999px;font-size:12px;color:var(--mut);white-space:nowrap}
.model-chip.b{color:var(--ac)}
.stat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.stat-dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.stat-dot.off{background:var(--dim)}
.iconbtn.adb{width:34px;height:34px;border-radius:10px;font-size:16px}

/* ---------- Chat ---------- */
#chat{flex:1;overflow-y:auto;padding:30px 30px 12px;scroll-behavior:smooth}
#chat::-webkit-scrollbar{width:9px}
#chat::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:6px}
#chat::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.14)}
.msg{display:flex;gap:12px;margin-bottom:24px;max-width:920px;animation:fadeUp .28s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.me{flex-direction:row-reverse;margin-left:auto;max-width:820px}
.msg .ava{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0;color:#fff;margin-top:2px}
.msg.ai .ava{background:var(--ac-grad);box-shadow:0 4px 14px rgba(139,168,223,.3)}
.msg.me .ava{background:#39424e}
.msg .bubble{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;max-width:100%}
.msg.me .bubble{background:rgba(110,168,223,.1);border-color:rgba(110,168,223,.16)}
.msg .who{font-size:11px;color:var(--dim);margin-bottom:3px;font-weight:600;letter-spacing:.04em}
.msg .text{white-space:pre-wrap;word-wrap:break-word;color:#dfe7f0;line-height:1.65}
.msg .text p{margin:0 0 8px}
.msg .text p:last-child{margin-bottom:0}
.msg .text h3,.msg .text h4{margin:12px 0 6px;color:var(--txt)}
.msg .text code{background:rgba(255,255,255,.07);border-radius:5px;padding:1px 6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#ffd9a3}
.msg .text pre{background:#0c1016;border:1px solid var(--line);border-radius:10px;padding:13px 15px;overflow-x:auto;margin:8px 0;line-height:1.5}
.msg .text pre code{background:none;border:0;padding:0;color:#c7d3e2}
.msg .text b{color:#fff;font-weight:700}
.meta{font-size:10.5px;color:var(--dim);margin-top:7px}
.cursor{display:inline-block;width:9px;height:15px;background:var(--ac);margin-left:2px;vertical-align:-2px;animation:blink 1s steps(1) infinite;border-radius:2px}
@keyframes blink{50%{opacity:.2}}
.placeholder{height:100%;display:grid;place-items:center;text-align:center;color:var(--dim);padding:20px}
.placeholder h2{font-size:23px;margin-bottom:10px;color:var(--txt);font-weight:700}
.placeholder p{max-width:440px;font-size:13.5px;line-height:1.8}

.composer-wrap{padding:14px 28px 20px;border-top:1px solid var(--line)}
.composer-bar{display:flex;align-items:center;gap:14px;margin-bottom:8px;color:var(--dim);font-size:12px}
.composer{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-end;box-shadow:var(--shadow);transition:border-color .2s}
.composer:focus-within{border-color:rgba(110,168,223,.4)}
#input{flex:1;background:transparent;border:0;outline:0;color:var(--txt);font:inherit;resize:none;max-height:160px;line-height:1.55}
#input::placeholder{color:var(--dim)}
.sendbtn{width:40px;height:40px;border:0;border-radius:11px;display:grid;place-items:center;color:#fff;flex-shrink:0;background:var(--ac-grad);transition:.18s;box-shadow:0 6px 16px rgba(94,168,223,.28)}
.sendbtn:hover{transform:translateY(-1px);filter:brightness(1.06)}
.sendbtn:disabled{opacity:.45;transform:none;cursor:not-allowed;box-shadow:none}
.toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--ac)}

/* ---------- ADB panel ---------- */
#rightbar{width:0;overflow:hidden;border-left:1px solid var(--line);transition:width .28s ease;background:var(--bg2);flex-shrink:0;display:flex;flex-direction:column}
#rightbar.open{width:304px}
.rp-head{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.rp-head b{font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:600}
.pill.off{background:rgba(248,113,113,.1);color:var(--err);border:1px solid rgba(248,113,113,.25)}
.pill.on{background:rgba(74,222,128,.1);color:var(--ok);border:1px solid rgba(74,222,128,.3)}
.rp-body{padding:14px 18px;overflow-y:auto}
.rp-label{font-size:10.5px;color:var(--dim);font-weight:700;margin:18px 0 8px;letter-spacing:.1em;text-transform:uppercase}
.rp-label:first-child{margin-top:0}
.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--txt);font:inherit;outline:0;font-size:12.5px;transition:.15s}
.inp:focus{border-color:var(--ac)}
.dev-empty,.empty{color:var(--dim);font-size:12px;padding:4px 2px}
.dev{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 12px;display:flex;align-items:center;gap:9px;margin-bottom:6px}
.dev .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex-shrink:0}
.dev.on .dot{background:var(--ok);box-shadow:0 0 7px var(--ok)}
.dev .did{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--txt);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:9px;border:0;cursor:pointer;font-size:12.5px;font-weight:600;transition:.15s;color:#fff}
.btn.acc{background:var(--ac-grad)}
.btn.acc:hover{filter:brightness(1.08)}
.btn.sec{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--txt)}
.btn.sec:hover{background:rgba(255,255,255,.12)}
.mt-actions{display:flex;gap:10px;margin-top:12px}
.acmd{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 12px;color:var(--mut);cursor:pointer;margin-bottom:6px;font-size:12.5px;transition:.14s}
.acmd:hover{border-color:var(--ac);color:var(--txt);transform:translateX(2px)}
#adOut{background:#0b0f15;border:1px solid var(--line);border-radius:10px;padding:12px;height:190px;overflow-y:auto;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;color:#9ee6b2;margin-top:6px}
.adbbar{display:flex;gap:8px;margin-top:10px}
.adbbar .inp{flex:1}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(5,8,12,.7);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:50}
.overlay.show{display:flex}
.modal{background:var(--panel2);background:var(--bg2);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);width:min(560px,92vw);max-height:88vh;overflow-y:auto;padding:28px;animation:pop .26s cubic-bezier(.18,.9,.3,1.15)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal h2{font-size:18px;font-weight:700;margin-bottom:6px}
.modal .lead{color:var(--dim);font-size:12.5px;margin-bottom:20px}
.frm{margin-bottom:15px}
.frm label{display:block;font-size:11.5px;color:var(--mut);margin-bottom:6px;font-weight:500;letter-spacing:.02em}
.frm .inp{padding:11px 12px;font-size:13px}
.frm .hint{font-size:11px;color:var(--dim);margin-top:5px;line-height:1.6}
.row{display:flex;gap:12px}
.row>*{flex:1}
.capsule{display:inline-flex;gap:3px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.capsule button{border:0;background:transparent;color:var(--dim);padding:7px 18px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:600;transition:.18s;flex:1}
.capsule button.on{background:var(--ac-grad);color:#fff}
#thinkSel{display:flex}
#modelList{max-height:180px}
#cfgResult{margin-top:6px;font-size:12.5px}
.ok-txt{color:var(--ok)}.err-txt{color:var(--err)}.mut-txt{color:var(--dim)}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--panel2);background:#1c2531;border:1px solid var(--line);color:var(--txt);padding:11px 20px;border-radius:11px;box-shadow:var(--shadow);opacity:0;transition:.3s;z-index:100;font-size:13px;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:rgba(248,113,113,.45);color:#ffe0e3}

@media(max-width:900px){
  #sidebar{width:84px}
  .brand h1,.brand small,.wsitem .info,.side-btn span{display:none}
  .wsitem{justify-content:center;padding:10px 4px}
  .wsitem.active::before{display:none}
  .side-btn{display:flex}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="logo">A</div>
      <div class="bt"><h1>AI Agent <span class="mode" id="modeTag">桌面</span></h1><small>Monkey Sandbox</small></div>
    </div>
    <div class="ws-top"><span>工作区</span><button class="iconbtn" id="addWs" title="新建工作区">+</button></div>
    <div id="wsList"></div>
    <div class="side-foot">
      <button class="side-btn" id="openSettings"><span>⚙ 模型接口设置</span></button>
    </div>
  </aside>

  <main id="main">
    <div id="topbar">
      <div>
        <div class="tt" id="curTtl">AI Agent</div>
        <div class="sub" id="curSub">配置模型接口，开始对话</div>
      </div>
      <div class="spacer"></div>
      <span class="model-chip"><span class="stat-dot off" id="mDot"></span>模型 <b id="mName">未配置</b></span>
      <button class="iconbtn icon-btn adb" id="toggleAdb" title="ADB 终端">◉</button>
    </div>

    <div id="chat"></div>

    <div class="composer-wrap">
      <div class="composer-bar">
        <label class="toggle"><input type="checkbox" id="ctxOn" checked>携带上下文</label>
        <span id="tokInfo"></span>
      </div>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="向 AI Agent 提问（支持多行）…"></textarea>
        <button class="sendbtn" id="sendBtn" aria-label="发送">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 12L21 3l-6 9 6 9L3 12z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </main>

  <aside id="rightbar">
    <div class="rp-head"><b>ADB 终端</b><span class="pill off" id="adbPill">未连接</span></div>
    <div class="rp-body">
      <div class="rp-label">设备</div>
      <div class="devlist" id="devlist"><div class="dev-empty">暂无设备</div></div>
      <div class="mt-actions"><button class="btn sec" id="scanBtn">⟳ 扫描设备</button></div>
      <div class="rp-label">adb 路径</div>
      <input class="inp" id="adbPath" placeholder="留空用系统 adb">
      <p class="desc" style="font-size:11px;color:var(--dim);line-height:1.6;margin:8px 0">沙箱与 ADB 在桌面版可用；Web 预览仅展示受限命令。</p>
      <div class="rp-label">常用命令</div>
      <button class="acmd" data-c="devices -l">devices -l</button>
      <button class="acmd" data-c="get-state">get-state</button>
      <button class="acmd" data-c="shell uptime">shell uptime</button>
      <button class="acmd" data-c="shell ps -A">shell ps -A</button>
      <button class="acmd" data-c="logcat -d -t 60">logcat -d -t 60</button>
      <button class="acmd" data-c="dumpsys battery">dumpsys battery</button>
      <div class="rp-label">控制台</div>
      <div id="adOut">—— ADB 输出 ——</div>
      <div class="adbbar">
        <input class="inp" id="conInput" placeholder="如 shell date">
        <button class="btn acc" id="conSend">执行</button>
      </div>
    </div>
  </aside>
</div>

<div class="overlay" id="settingsModal">
  <div class="modal">
    <h2>模型接口设置</h2>
    <p class="lead">支持任意 OpenAI 兼容接口或官方端点。密钥仅保存在本机。</p>
    <div class="frm">
      <label>接口模式</label>
      <div class="capsule" id="provSel">
        <button type="button" data-v="openai" class="on">OpenAI 官方</button>
        <button type="button" data-v="custom">自定义 Base URL</button>
      </div>
    </div>
    <form id="settingsForm" autocomplete="off">
      <div class="frm" id="baseGroup" style="display:none">
        <label>Base URL</label>
        <input class="inp" id="fBase" placeholder="https://api.openai.com/v1" spellcheck="false">
        <div class="hint">OpenAI 兼容端点，支持 /v1。DeepSeek：https://api.deepseek.com/v1</div>
      </div>
      <div class="frm">
        <label>API Key</label>
        <input class="inp" id="fKey" type="password" autocomplete="new-password" placeholder="sk-..." spellcheck="false">
      </div>
      <div class="frm">
        <label>模型</label>
        <div class="model-row" style="display:flex;gap:8px">
          <input class="inp" id="fModel" placeholder="gpt-4o / deepseek-chat / claude-..." spellcheck="false" style="flex:1">
          <button type="button" class="btn sec" id="fetchModelsBtn" title="拉取该接口支持的所有模型">拉取列表</button>
        </div>
        <div id="modelListWrap" style="display:none;margin-top:6px">
          <select class="inp" id="modelList"></select>
        </div>
      </div>
      <div class="frm">
        <label>思考深度（Reasoning / 思考）</label>
        <div class="capsule" id="thinkSel" style="width:100%">
          <button type="button" data-v="off" class="on">关闭</button>
          <button type="button" data-v="low">低</button>
          <button type="button" data-v="medium">中</button>
          <button type="button" data-v="high">高</button>
        </div>
      </div>
      <div class="row">
        <div class="frm"><label>Temperature</label><input class="inp" id="fTemp" type="number" step="0.1" min="0" max="2" value="0.7"></div>
        <div class="frm"><label>Top P</label><input class="inp" id="fTop" type="number" step="0.05" min="0" max="1" value="1"></div>
      </div>
      <div id="cfgResult"></div>
      <div class="mt-actions" style="justify-content:flex-end;margin-top:14px">
        <button type="button" class="btn sec" id="testBtn">测试连接</button>
        <button type="button" class="btn sec" id="cancelBtn">取消</button>
        <button type="submit" class="btn acc">保存配置</button>
      </div>
    </form>
  </div>
</div>

<!-- 确认对话框（替代原生 confirm） -->
<div class="overlay" id="confirmModal">
  <div class="modal" style="width:min(380px,90vw);padding:24px">
    <h2 id="confirmTxt" style="font-size:15px;margin:0 0 4px">确认操作</h2>
    <p class="lead" id="confirmMsg" style="margin-bottom:18px">确定要执行吗？</p>
    <div class="mt-actions" style="justify-content:flex-end">
      <button class="btn sec" id="confirmNo">取消</button>
      <button class="btn acc" id="confirmYes">确定</button>
    </div>
  </div>
</div>

<!-- 新建工作区命名 -->
<div class="overlay" id="wsModal">
  <div class="modal" style="width:min(420px,90vw);padding:24px">
    <h2 style="font-size:16px;margin-bottom:16px">新建工作区</h2>
    <div class="frm">
      <label>名称</label>
      <input class="inp" id="wsName" placeholder="输入工作区名称">
    </div>
    <div class="mt-actions" style="justify-content:flex-end">
      <button type="button" class="btn sec" id="wsCancel">取消</button>
      <button type="button" class="btn acc" id="wsOk">创建</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
