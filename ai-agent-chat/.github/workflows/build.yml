name: Build-Dist

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ai-agent-chat
        run: npm install

      - name: Build AppImage
        working-directory: ai-agent-chat
        run: npx electron-builder --linux AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Agent-Chat
          path: ai-agent-chat/dist/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: AI-Agent-Chat
          path: dist
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage